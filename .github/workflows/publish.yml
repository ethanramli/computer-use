name: publish
on:
  push:
    tags: ["v*"]
permissions:
  id-token: write # PyPI trusted publishing (OIDC, no stored token)
  contents: write # GitHub release notes
jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -c "import desktop._version as v; assert 'v'+v.__version__ == '${{ github.ref_name }}', 'tag must match desktop/_version.py'"
      - run: pip install build pytest
      - run: python -m pytest -q
      - run: python -m compileall -q desktop tests
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: clang -fsyntax-only -Wall -Wextra -Werror native/cghelper.c
      - run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          COMPUTER_AUTOMATION_RUST_PREFIX="$smoke_root/prefix" \
          COMPUTER_AUTOMATION_RUST_SHIM_DIR="$smoke_root/bin" \
          ./install-rust-preview
          "$smoke_root/prefix/bin/desktop" --help >/dev/null
          "$smoke_root/prefix/bin/computer-mcp" --help >/dev/null
          test -x "$smoke_root/prefix/bin/cghelper"
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - run: gh release create "${{ github.ref_name }}" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
