name: publish
on:
  push:
    tags: ["v*"]
permissions:
  id-token: write # PyPI trusted publishing (OIDC, no stored token)
  contents: write # GitHub release notes
jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -c "import desktop._version as v; assert 'v'+v.__version__ == '${{ github.ref_name }}', 'tag must match desktop/_version.py'"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - run: gh release create "${{ github.ref_name }}" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
